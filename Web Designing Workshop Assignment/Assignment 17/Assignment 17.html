<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <form action="#" method="post">
      <input type="text" id="name" name="name" placeholder="Full name" required>
      <br><br>

      <input type="email" id="email" name="email" placeholder="you@college.edu" required>
      <br><br>

      <input type="tel" id="number" name="number" placeholder="10-digit mobile" required>
      <br><br>

      <input type="text" id="password" name="password" placeholder="Min 6 characters" required>
      <br><br>

      <select>
            <option value="" disabled selected>Age (17)</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20+ years</option>
      </select>
      <br><br>

      <button type="submit">Register</button>

    </form>
</body>
</html>
