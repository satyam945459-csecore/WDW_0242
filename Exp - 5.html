<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>
    <h1 align="center"><b>Student Registration Form</b></h1>
    <hr>
            <form action="#" method="post">
                <label for="name">Full Name :</label>
                <input type="text" id="name" name="name" required placeholder="Enter Your Full Name">
                <br>
                <br>
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required placeholder="Enter Your Email">
                <br>
                <br>
                <label for="Password">Password :</label>
                <input type="password" id="Password" name="Password" required placeholder="Enter Your Password">
                <br>
                <br>
                <label for="Gender">Gender :</label>
                <br><br>
                <label for="Course">Course :</label>
                <select type="Course" id="Course" name="Course">
                        <option>Select Course</option>
                        <option>B - Tech</option>
                        <option>M - Tech</option>
                        <option>Phd</option>
                        <option>BCA</option>
                </select>
                <br>
                <br>
                <label for="phone">Phone Number :</label>
                <input type="phone" id="phone" name="phone" required placeholder="Enter Your Phone Number">
                <br>
                <br>
                <label for="room">Room Type:</label>
                <select id="room" name="room">
                    <option>Single Room</option>
                    <option>Double Room</option>
                    <option>Deluxe Room</option>
                    <option>Suite</option>
                    <option>Non AC Room</option>
                </select>
                <br>
                <br>
                <label for="guests">Number of Guests:</label>
                <input type="number" id="guests" name="guests"
                       min="1" max="5" required>
                <br>
                <br>
                <label for="requests">Special Requests:</label>
                <br>
                <textarea id="requests" name="requests"
                          rows="3" cols="32"></textarea>
                <br>
                <br>

                <button type="submit">Book Now</button>
                <button type="reset">Reset Form</button>
            </form>
        </fieldset>
    

</body>
</html>
