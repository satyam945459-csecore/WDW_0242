<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video Player</title>
</head>
<body>
  <h1 align="center">Multimedia Player</h1>
  <h2>Audio Section</h2>
<audio controls>
  <source src="song.mp3" type="audio/mp3">
</audio>
<hr>
  <h2>Video Section</h2>
<video width="350" height="250" controls>
  <source src="college.mp4" type="video/mp4">
</video>
</body>
